{%extends "base.html"%}
{% block content %}
<div class="box">
    <div class="cla">
        <img src="{{game.cover}}" alt="Description of the image for accessibility"
            onerror="this.onerror=null; this.src='../static/link.jpg'">
        <div>
            {{game.title}}
        </div>
    </div>

    <div class="title">
        <div>{{game.genre}}</div>
        <div>{{game.platform}}</div>
        <div>{{game.status}}</div>

    </div>
    <div class="review">{{game.description}}</div>
    <div class="butto">
           <a href="{{url_for('collection')}}"><button class="btn small">Back</button></a>
    <a href="{{ url_for('edit', game_id=game.id) }}"><button class="btn small x">Edit</button></a>
    <form action="{{ url_for('delete', game_id=game.id) }}" method="POST" >
        <button type="submit" onclick="return confirm('Are you sure you want to delete this user?');" class="btn small">
          Delete
        </button>
      </form>
    </div>
</div>

{% endblock %}
